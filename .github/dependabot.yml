version: 2

updates:
  # Every action is pinned to a commit SHA; Dependabot reads the `# vX.Y.Z`
  # comment beside it and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
