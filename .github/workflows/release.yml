name: Release

# Push a tag equal to the version in manifest.json, with no leading v
# (`git tag 0.2.0 && git push origin 0.2.0`). Obsidian's installer looks
# for exactly that tag and downloads the files attached to it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, exactly as in manifest.json (e.g. 0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm

      # The tag must equal manifest.json's version, and the CHANGELOG
      # must have a section for it, or nothing is published.
      - name: Work out which version this is
        id: pick
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          node scripts/check-manifest.mjs "$version"
          packaging/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Builds main.js from the tagged commit and runs the suite against it.
      - name: make check
        run: make check

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          packaging/release-notes.sh "$VERSION" > notes.md
          assets=(main.js manifest.json styles.css)
          title="Engineering Toolkit $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION exists: updating its notes and files"
            gh release edit "$VERSION" --title "$title" --notes-file notes.md
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md "${assets[@]}"
          fi
